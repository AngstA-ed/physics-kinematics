# Single source of truth for lesson structure rules.
# Both tools/scaffold_lesson.py and tools/validators.py read this.

# Teacher guides are organized by the 5E phenomenon-based lesson model
# documented in the joint East Meadow / Valley Stream Central PPTX (slide 32).
# Each phase has minute-by-minute facilitation script, anticipated student
# responses, and sample teacher language inside.
teacher_guide_required_headings:
  - "Cover"
  - "Curated Resources (from East Meadow Scope & Sequence)"
  - "Lesson Overview"
  - "Phase 1 · Engage"
  - "Phase 2 · Explore"
  - "Phase 3 · Explain"
  - "Phase 4 · Elaborate"
  - "Phase 5 · Evaluate"
  - "Common Misconceptions"
  - "Access & Differentiation"
  - "Strategy Spotlight"
  - "NYSSLS Observation Checklist Crosswalk"
  - "Companion Materials"
  - "Key Vocabulary (max 3)"

curated_resources_required_subheadings:
  - "NYSSLS Standards"
  - "Phenomenon"
  - "Javalab / Labs"
  - "Assessments"

answer_key_required_headings:
  - "Cover"
  - "Make-It-Make-Sense Answers"
  - "Exit Ticket Answer"
  - "Closing Reflection (rubric)"

unit_plan_required_headings:
  - "Cover"
  - "Unit Scope (from East Meadow Scope & Sequence)"
  - "Pacing Calendar"
  - "Strategy Rotation"
  - "NYSSLS Coverage Matrix"
  - "Vocabulary Scope"

student_html_required_data_sections:
  - "phenomenon"
  - "driving-question"
  - "notice-wonder"
  - "initial-model"
  - "interactive"
  - "make-it-make-sense"
  - "vocab"
  - "revise-model"
  - "return-to-phenomenon"
  - "exit-ticket"
  - "explore-further"

vocab_max: 3

forbidden_in_onenote_html:
  - "<script"
  - "<iframe"
  - "<link rel=\"stylesheet\""

# Assessment validation
# The build hard-fails if a Regents-style multiple-choice option line contains
# any of these markers, since they reveal the correct answer to students. Move
# emphasis to the explicit answer-key section instead.
assessment_mc_section_heading: "Multiple Choice"
forbidden_in_mc_options:
  - "**"        # markdown bold
  - "<strong>"  # HTML bold (in case anyone hand-codes inline HTML)
  - "<b>"
  - "__"        # markdown bold via underscores

# Web-edition (hand-authored HTML) check — same intent as the markdown rule
# above, but enforced via DOM inspection rather than text matching. The
# pre-deploy step in .github/workflows/deploy-pages.yml runs this against
# every *.html under Publisher_Ready_Curriculum/01_Physics_East_Meadow_Web/.
forbidden_in_web_mc_options:
  - "strong"
  - "b"
  - "em"        # also catches italics, which would similarly mark an answer

strategy_chip_values:
  - "HOCHMAN"
  - "ACTIVE LEARNING"
  - "BTC"
  - "RESTORATIVE CIRCLE"
